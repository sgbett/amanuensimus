<!DOCTYPE html>
<!-- Source for www/og.png (1200x630). Rendered to PNG via headless Chrome; not deployed. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html, body{ width: 1200px; height: 630px; }
  body{
    background: #ffffff;
    color: #171717;
    font-family: Georgia, "Times New Roman", Times, serif;
    display: grid;
    grid-template-columns: 1fr 1fr;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  .half{ display: flex; align-items: center; padding: 0 4.5rem; }
  .left{ justify-content: flex-end; text-align: right; }
  .right{ justify-content: flex-start; text-align: left; border-left: 2px solid #171717; }
  .credo{ font-style: italic; font-size: 3.4rem; line-height: 1.1; }
  .wordmark{ position: absolute; top: 3.2rem; left: 4.5rem; font-size: 1.5rem; letter-spacing: .02em; }
  .graft{ color: #6f6f6f; }
  .url{
    position: absolute; bottom: 3.2rem; right: 4.5rem;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 1.05rem; color: #6f6f6f; letter-spacing: .06em;
  }
</style>
</head>
<body>
  <div class="wordmark">amanuensi<span class="graft">mus</span></div>
  <div class="half left"><p class="credo">We did this.</p></div>
  <div class="half right"><p class="credo">I answer for it.</p></div>
  <div class="url">amanuensimus.com</div>
  <svg style="position:absolute;bottom:2.9rem;left:4.5rem" width="30" height="40" viewBox="-4 6 128 128" aria-hidden="true">

    <line stroke="#171717" stroke-width="12" x1="54" y1="6" x2="54" y2="134"/>
    <line stroke="#6f6f6f" stroke-width="12" x1="84" y1="6" x2="84" y2="134"/>
  </svg>
</body>
</html>
